name: Check reviewed patches against upstream dev

on:
  workflow_dispatch:


permissions:
  actions: write
  contents: read

concurrency:
  group: check-reviewed-patches-upstream-dev
  cancel-in-progress: false

jobs:
  check:
    name: Apply all reviewed patches to current upstream-dev
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v7
        with:
          ref: mtproto-patches
          fetch-depth: 1
          path: patch-source

      - name: Checkout upstream-dev mirror
        uses: actions/checkout@v7
        with:
          ref: upstream-dev
          fetch-depth: 1
          path: source

      - name: Verify mirror and patch application
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          patch_source="$GITHUB_WORKSPACE/patch-source/patches"
          source_dir="$GITHUB_WORKSPACE/source"

          source_sha="$(
            git -C "$source_dir" rev-parse HEAD
          )"

          official_sha="$(
            git ls-remote \
              https://github.com/telegramdesktop/tdesktop.git \
              refs/heads/dev |
            awk '{ print $1 }'
          )"

          echo "Mirror SHA:   $source_sha"
          echo "Official SHA: $official_sha"

          if [[ -z "$official_sha" ]]; then
            echo "::error::Could not resolve official dev SHA."
            exit 1
          fi

          if [[ "$source_sha" != "$official_sha" ]]; then
            echo "::error::upstream-dev is not an exact mirror of official dev."
            exit 1
          fi

          patches=(
            "$patch_source/0001-proxy-mtproto-client-hello-delay.diff"
            "$patch_source/0002-main-menu-version-commit-build-tooltip.diff"
          )

          for patch in "${patches[@]}"; do
            if [[ ! -f "$patch" ]]; then
              echo "::error::Reviewed patch file was not found: $patch"
              exit 1
            fi
          done

          for patch in "${patches[@]}"; do
            echo "::group::Checking and applying $(basename "$patch")"

            git -C "$source_dir" apply \
              --check \
              --verbose \
              "$patch"

            git -C "$source_dir" apply \
              --verbose \
              "$patch"

            echo "::endgroup::"
          done

          menu_file="$source_dir/Telegram/SourceFiles/window/window_main_menu.cpp"
          helper_file="$source_dir/Telegram/SourceFiles/window/window_main_menu_helpers.cpp"
          source_short_sha="${source_sha:0:7}"
          source_commit_time_utc="$(
            TZ=UTC git -C "$source_dir" show -s \
              --format=%cd \
              --date=format-local:'%Y-%m-%d %H:%M:%S UTC' \
              HEAD
          )"
          source_build_time_utc="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          full_placeholder_count="$(
            grep -Foc "__TDESKTOP_COMMIT_FULL__" "$menu_file" ||
            true
          )"

          short_placeholder_count="$(
            grep -Foc "__TDESKTOP_COMMIT_SHORT__" "$menu_file" ||
            true
          )"

          commit_time_placeholder_count="$(
            grep -Foc "__TDESKTOP_COMMIT_TIME_UTC__" "$helper_file" ||
            true
          )"

          build_time_placeholder_count="$(
            grep -Foc "__TDESKTOP_BUILD_TIME_UTC__" "$helper_file" ||
            true
          )"

          if [[ "$full_placeholder_count" != "1" ||
                "$short_placeholder_count" != "1" ||
                "$commit_time_placeholder_count" != "1" ||
                "$build_time_placeholder_count" != "1" ]]; then
            echo "::error::Expected exactly one commit/build placeholder of each kind."
            echo "Full placeholders:        $full_placeholder_count"
            echo "Short placeholders:       $short_placeholder_count"
            echo "Commit time placeholders: $commit_time_placeholder_count"
            echo "Build time placeholders:  $build_time_placeholder_count"
            exit 1
          fi

          sed -i \
            -e "s|__TDESKTOP_COMMIT_FULL__|$source_sha|g" \
            -e "s|__TDESKTOP_COMMIT_SHORT__|$source_short_sha|g" \
            "$menu_file"

          sed -i \
            -e "s|__TDESKTOP_COMMIT_TIME_UTC__|$source_commit_time_utc|g" \
            -e "s|__TDESKTOP_BUILD_TIME_UTC__|$source_build_time_utc|g" \
            "$helper_file"

          if grep -Fq "__TDESKTOP_" "$menu_file" "$helper_file"; then
            echo "::error::Commit/build placeholders remain after substitution."
            exit 1
          fi

          grep -Fq \
            "https://github.com/telegramdesktop/tdesktop/commit/$source_sha" \
            "$menu_file"

          grep -Fq \
            "u\"$source_short_sha\"_q" \
            "$menu_file"

          grep -Fq \
            "Commit: $source_commit_time_utc" \
            "$helper_file"

          grep -Fq \
            "Build: $source_build_time_utc" \
            "$helper_file"

          git -C "$source_dir" diff --check

          echo "Modified files:"
          git -C "$source_dir" status --short

          {
            echo "## Reviewed patch validation"
            echo
            echo "- upstream-dev SHA: \`$source_sha\`"
            echo "- applied patches: \`${#patches[@]}\`"
            echo "- result: all patches applied successfully"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Start Windows build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.validate.outputs.source_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Validated source SHA is invalid: $SOURCE_SHA"
            exit 1
          fi

          gh workflow run \
            build-patched-upstream-dev-windows.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref mtproto-patches \
            -f "source_sha=$SOURCE_SHA"

          echo "Windows build workflow dispatched for $SOURCE_SHA."
