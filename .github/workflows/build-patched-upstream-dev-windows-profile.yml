name: Build upstream dev Windows profile

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact upstream-dev commit pinned by the parent workflow.
        required: true
        type: string
      source_repository:
        description: Repository to checkout for the pinned source commit.
        required: true
        type: string
      variant:
        description: Build variant, vanilla or patched.
        required: true
        type: string
      cache_key:
        description: Exact dependency cache key produced by the preparation job.
        required: true
        type: string
      runner:
        description: GitHub-hosted runner label.
        required: true
        type: string
      profile:
        description: Stable machine-readable profile identifier.
        required: true
        type: string
      profile_title:
        description: Human-readable profile description.
        required: true
        type: string
      generator:
        description: official or ninja.
        required: true
        type: string
      lto_mode:
        description: on or off.
        required: true
        type: string
      parallel:
        description: Number of parallel build processes.
        required: true
        type: number
      require_vs2026:
        description: Require Visual Studio 2026.
        required: true
        type: boolean
    outputs:
      built:
        description: true only when a verified package was uploaded.
        value: ${{ jobs.build.outputs.built }}
    secrets:
      TDESKTOP_API_ID:
        description: Telegram API ID for the client build.
        required: true
      TDESKTOP_API_HASH:
        description: Telegram API hash for the client build.
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.profile_title }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    continue-on-error: true

    outputs:
      built: ${{ steps.result.outputs.built }}

    env:
      REPO_NAME: tdesktop
      BUILD_PROFILE: ${{ inputs.profile }}
      BUILD_VARIANT: ${{ inputs.variant }}
      BUILD_PROFILE_TITLE: ${{ inputs.profile_title }}
      BUILD_GENERATOR: ${{ inputs.generator }}
      BUILD_LTO_MODE: ${{ inputs.lto_mode }}
      BUILD_PARALLEL: ${{ inputs.parallel }}
      REQUIRE_VS2026: ${{ inputs.require_vs2026 }}
      SCCACHE_GHA_ENABLED: "true"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare TBuild directories
        run: |
          if not exist %userprofile%\TBuild\Libraries mkdir %userprofile%\TBuild\Libraries
          if exist %GITHUB_WORKSPACE%\TBuild rmdir %GITHUB_WORKSPACE%\TBuild
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout patched variant sources
        if: ${{ inputs.variant == 'patched' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: mtproto-patches
          fetch-depth: 1
          path: patch-source

      - name: Checkout pinned source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Verify pinned mirror and record source revision
        id: source
        shell: bash
        env:
          PINNED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          source_dir="$(cygpath -u "$TBUILD/$REPO_NAME")"
          mirror_sha="$(git -C "$source_dir" rev-parse HEAD)"
          official_sha="$(
            git ls-remote https://github.com/telegramdesktop/tdesktop.git \
              refs/heads/dev |
            awk '{ print $1 }'
          )"

          if [[ ! "$PINNED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Parent workflow supplied an invalid pinned SHA."
            exit 1
          fi

          if [[ "$mirror_sha" != "$PINNED_SOURCE_SHA" ]]; then
            echo "::error::Checked out SHA does not match the pinned cascade SHA."
            echo "Checked out: $mirror_sha"
            echo "Pinned:      $PINNED_SOURCE_SHA"
            exit 1
          fi

          echo "Pinned mirror SHA: $mirror_sha"

          if [[ -n "$official_sha" ]]; then
            echo "Current official SHA: $official_sha"

            if [[ "$mirror_sha" != "$official_sha" ]]; then
              echo "::warning::Official dev advanced after the mirror was reviewed."
              echo "::warning::Building the exact pinned upstream-dev commit for consistency."
            fi
          else
            echo "::warning::Could not resolve the current official dev SHA."
          fi

          git -C "$source_dir" log -1 --format='%H%n%ci%n%s'

          short_sha="${mirror_sha:0:7}"
          echo "sha=$mirror_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$mirror_sha" >> "$GITHUB_ENV"
          echo "SOURCE_SHORT_SHA=$short_sha" >> "$GITHUB_ENV"

      - name: Read official SDK requirement
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$(cygpath -u "$TBUILD/$REPO_NAME")"
          doc="$source_dir/docs/building-win.md"

          sdk="$(
            grep "SDK version" "$doc" |
            sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/'
          )"

          if [[ -z "$sdk" ]]; then
            echo "::error::Could not detect Windows SDK version."
            exit 1
          fi

          echo "SDK=$sdk" >> "$GITHUB_ENV"
          echo "Official Windows SDK requirement: $sdk"

      - name: Apply patched variant changes and embed source metadata
        if: ${{ inputs.variant == 'patched' }}
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$(cygpath -u "$TBUILD/$REPO_NAME")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          patch_dir="$workspace/patch-source/patches"
          patches=(
            "$patch_dir/0001-proxy-mtproto-client-hello-delay.diff"
            "$patch_dir/0002-main-menu-version-commit-build-tooltip.diff"
          )

          for patch in "${patches[@]}"; do
            if [[ ! -f "$patch" ]]; then
              echo "::error::Patched variant file was not found: $patch"
              exit 1
            fi
          done

          for patch in "${patches[@]}"; do
            echo "::group::Applying $(basename "$patch")"
            git -C "$source_dir" apply --check --verbose "$patch"
            git -C "$source_dir" apply --verbose "$patch"
            echo "::endgroup::"
          done

          menu_file="$source_dir/Telegram/SourceFiles/window/window_main_menu.cpp"
          helper_file="$source_dir/Telegram/SourceFiles/window/window_main_menu_helpers.cpp"
          source_commit_time_utc="$(
            TZ=UTC git -C "$source_dir" show -s \
              --format=%cd \
              --date=format-local:'%Y-%m-%d %H:%M:%S UTC' \
              HEAD
          )"

          full_placeholder_count="$(grep -Foc "__TDESKTOP_COMMIT_FULL__" "$menu_file" || true)"
          short_placeholder_count="$(grep -Foc "__TDESKTOP_COMMIT_SHORT__" "$menu_file" || true)"
          commit_time_placeholder_count="$(grep -Foc "__TDESKTOP_COMMIT_TIME_UTC__" "$helper_file" || true)"
          build_time_placeholder_count="$(grep -Foc "__TDESKTOP_BUILD_TIME_UTC__" "$helper_file" || true)"

          if [[ "$full_placeholder_count" != "1" ||
                "$short_placeholder_count" != "1" ||
                "$commit_time_placeholder_count" != "1" ||
                "$build_time_placeholder_count" != "1" ]]; then
            echo "::error::Expected exactly one source/build metadata placeholder of each kind."
            exit 1
          fi

          sed -i \
            -e "s|__TDESKTOP_COMMIT_FULL__|$SOURCE_SHA|g" \
            -e "s|__TDESKTOP_COMMIT_SHORT__|$SOURCE_SHORT_SHA|g" \
            "$menu_file"

          sed -i \
            -e "s|__TDESKTOP_COMMIT_TIME_UTC__|$source_commit_time_utc|g" \
            "$helper_file"

          if grep -Fq "__TDESKTOP_COMMIT_" "$menu_file" "$helper_file"; then
            echo "::error::Commit placeholders remain after substitution."
            exit 1
          fi

          git -C "$source_dir" diff --check

          grep -Fq "constexpr auto kMaxServerHelloLength = 65536;" \
            "$source_dir/Telegram/SourceFiles/mtproto/details/mtproto_tls_socket.cpp"

          grep -Fq "u\"$SOURCE_SHORT_SHA\"_q" "$menu_file"
          grep -Fq "Commit: $source_commit_time_utc" "$helper_file"

          echo "Patched variant changes applied to $SOURCE_SHA."

      - name: Ensure ATL for MSVC 14.44 on Visual Studio 2026
        if: ${{ inputs.require_vs2026 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerRoot = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer"

          $vswhere = Join-Path $installerRoot "vswhere.exe"
          $setup = Join-Path $installerRoot "setup.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found: $vswhere"
          }

          if (-not (Test-Path $setup)) {
            throw "Visual Studio setup.exe was not found: $setup"
          }

          $vsPath = (
            & $vswhere `
              -latest `
              -products * `
              -version "[18.0,19.0)" `
              -property installationPath |
              Select-Object -First 1
          )

          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw "Visual Studio 2026 installation was not found."
          }

          $atlPattern = Join-Path `
            $vsPath `
            "VC\Tools\MSVC\14.44.*\atlmfc\include\atlbase.h"

          $atlHeader = Get-Item `
            -Path $atlPattern `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $atlHeader) {
            Write-Host "Installing ATL component for MSVC 14.44..."

            $arguments = @(
              "modify"
              "--installPath"
              "`"$vsPath`""
              "--add"
              "Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL"
              "--quiet"
              "--norestart"
            )

            $process = Start-Process `
              -FilePath $setup `
              -ArgumentList $arguments `
              -Wait `
              -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw (
                "Visual Studio ATL installation failed with exit code " +
                $process.ExitCode
              )
            }

            for ($attempt = 1; $attempt -le 12; $attempt++) {
              $atlHeader = Get-Item `
                -Path $atlPattern `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($atlHeader) {
                break
              }

              Start-Sleep -Seconds 5
            }
          }

          if (-not $atlHeader) {
            throw "ATL for MSVC 14.44 is still missing after installation."
          }

          Write-Host "ATL header: $($atlHeader.FullName)"

      - name: Initialize MSVC x64 environment
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: Verify compiler, SDK and ATL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "VisualStudioVersion=$env:VisualStudioVersion"
          Write-Host "VCToolsVersion=$env:VCToolsVersion"
          Write-Host "WindowsSDKVersion=$env:WindowsSDKVersion"
          Write-Host "VCToolsInstallDir=$env:VCToolsInstallDir"

          if (
            $env:REQUIRE_VS2026 -eq "true" -and
            -not $env:VisualStudioVersion.StartsWith("18.")
          ) {
            throw "This profile requires Visual Studio 2026."
          }

          $atlHeader = Join-Path `
            $env:VCToolsInstallDir `
            "atlmfc\include\atlbase.h"

          if (-not (Test-Path $atlHeader)) {
            throw "ATL header was not found: $atlHeader"
          }

          $compiler = (Get-Command "cl.exe").Source
          $compilerInfo = (Get-Item $compiler).VersionInfo

          Write-Host "Compiler=$compiler"
          Write-Host "Compiler version=$($compilerInfo.FileVersion)"

      - name: Run MTProto ClientHello tests
        if: ${{ inputs.variant == 'patched' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = Join-Path $env:TBUILD $env:REPO_NAME
          $tests = @(
            "chromium150_ticket_cache_test.cpp",
            "client_hello_validation_test.cpp"
          )

          foreach ($test in $tests) {
            $testSource = Join-Path `
              $env:GITHUB_WORKSPACE `
              "patch-source\patches\tests\$test"
            $testBinary = Join-Path `
              $env:RUNNER_TEMP `
              ([IO.Path]::GetFileNameWithoutExtension($test) + ".exe")

            & cl.exe `
              /nologo `
              /std:c++20 `
              /EHsc `
              /W4 `
              /WX `
              "/I$sourceDir\Telegram\SourceFiles" `
              $testSource `
              "/Fe:$testBinary"

            if ($LASTEXITCODE -ne 0) {
              throw "$test compilation failed."
            }

            & $testBinary

            if ($LASTEXITCODE -ne 0) {
              throw "$test failed."
            }
          }

      - name: Resolve Visual Studio 2026 instance for CMake
        if: ${{ inputs.generator == 'official' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerRoot = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer"

          $vswhere = Join-Path $installerRoot "vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found: $vswhere"
          }

          $installationPath = (
            & $vswhere `
              -latest `
              -products * `
              -version "[18.0,19.0)" `
              -property installationPath |
              Select-Object -First 1
          )

          $installationVersion = (
            & $vswhere `
              -latest `
              -products * `
              -version "[18.0,19.0)" `
              -property installationVersion |
              Select-Object -First 1
          )

          $installationPath = "$installationPath".Trim()
          $installationVersion = "$installationVersion".Trim()

          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw "Visual Studio 2026 installation path was not resolved."
          }

          if ([string]::IsNullOrWhiteSpace($installationVersion)) {
            throw "Visual Studio 2026 installation version was not resolved."
          }

          $generator = "Visual Studio 18 2026"
          $instance = (
            "$installationPath,version=$installationVersion"
          )
          $commonTools = Join-Path $installationPath "Common7\Tools"

          "CMAKE_GENERATOR=$generator" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "CMAKE_GENERATOR_INSTANCE=$instance" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "VS180COMNTOOLS=$commonTools" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "CMake generator: $generator"
          Write-Host "CMake generator instance: $instance"
          Write-Host "VS180COMNTOOLS: $commonTools"

          cmake --version

      - name: Free runner disk before Telegram build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          function Get-FreeGiB {
            [math]::Round(
              (Get-PSDrive -Name C).Free / 1GB,
              2
            )
          }

          $before = Get-FreeGiB
          Write-Host "Free disk before cleanup: $before GiB"

          $servicePattern = (
            "SQL|Postgre|MySQL|Mongo|Cosmos"
          )

          Get-Service |
            Where-Object {
              $_.Status -ne "Stopped" -and
              (
                $_.Name -match $servicePattern -or
                $_.DisplayName -match $servicePattern
              )
            } |
            Stop-Service -Force -ErrorAction SilentlyContinue

          $removePaths = @(
            "C:\Android",
            "C:\Program Files (x86)\Android",
            "C:\hostedtoolcache\windows\CodeQL",
            "C:\Program Files\dotnet\sdk",
            "C:\Program Files\Microsoft SQL Server",
            "C:\Program Files (x86)\Microsoft SQL Server",
            "C:\Program Files\PostgreSQL",
            "C:\Program Files\MySQL",
            "C:\Program Files\MongoDB",
            "C:\Program Files\Azure Cosmos DB Emulator",
            "C:\ProgramData\Microsoft\VisualStudio\Packages",
            "C:\ProgramData\Package Cache"
          )

          foreach ($path in $removePaths) {
            if (Test-Path $path) {
              Write-Host "Removing $path"
              & cmd.exe /d /c "rd /s /q `"$path`""
            }
          }

          $tempPaths = @(
            "$env:TEMP\*",
            "$env:LOCALAPPDATA\Temp\*",
            "$env:USERPROFILE\.nuget\packages\*",
            "C:\Windows\Temp\*"
          )

          foreach ($path in $tempPaths) {
            Remove-Item `
              $path `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Clear-RecycleBin `
            -Force `
            -ErrorAction SilentlyContinue

          $after = Get-FreeGiB
          $freed = [math]::Round($after - $before, 2)

          Write-Host "Free disk after cleanup: $after GiB"
          Write-Host "Freed by cleanup: $freed GiB"

          if ($after -lt 18) {
            Write-Warning (
              "Less than 18 GiB is free before dependency build. " +
              "The profile may still fall back automatically."
            )
          }

          $ErrorActionPreference = "Stop"

      - name: Configure NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore prepared ThirdParty cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-vs2026-upstream-dev-third-party-${{ inputs.cache_key }}
          fail-on-cache-miss: true

      - name: Restore prepared Release libraries cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-vs2026-upstream-dev-release-libs-${{ inputs.cache_key }}
          fail-on-cache-miss: true

      - name: Restore prepared Release Qt 6 cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-vs2026-upstream-dev-release-qt6-${{ inputs.cache_key }}
          fail-on-cache-miss: true

      - name: Prune dependency sources before Telegram build
        shell: bash
        run: |
          find "$LibrariesPath" \
            '(' \
              '(' \
                ! '(' \
                  -name '*.lib' -o \
                  -name '*.a' -o \
                  -name '*.exe' -o \
                  -name '*.h' -o \
                  -name '*.hpp' -o \
                  -name '*.inc' -o \
                  -name '*.cmake' -o \
                  -path '*/include/*' -o \
                  -path '*/objects-*' -o \
                  -path '*/cache_keys/*' -o \
                  -path '*/patches/*' \
                ')' \
                -type f \
              ')' \
              -o -empty \
            ')' -delete

      - name: Verify Telegram API secrets
        shell: pwsh
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if ($env:TDESKTOP_API_ID -notmatch '^[0-9]+$') {
            Write-Error 'TDESKTOP_API_ID repository secret is missing or invalid.'
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:TDESKTOP_API_HASH)) {
            Write-Error 'TDESKTOP_API_HASH repository secret is missing.'
            exit 1
          }

      - name: Enable shared MSVC compiler cache
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10

      - name: Configure and build selected profile
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ inputs.parallel }}
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          set "LTO_FLAGS=-D CMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=OFF"
          if /I "%BUILD_LTO_MODE%"=="on" set "LTO_FLAGS=-D CMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -D CMAKE_EXE_LINKER_FLAGS=/CGTHREADS:2"
          set "MTPROTO_TEST_FLAGS="
          if /I "%BUILD_VARIANT%"=="patched" set "MTPROTO_TEST_FLAGS=-D DESKTOP_APP_MTPROTO_PROFILE_TESTS=ON"

          rem Temporary CMake 4.4 compatibility; remove after upstream handles CMP0218.
          if /I "%BUILD_GENERATOR%"=="official" (
            set "CMAKE_GENERATOR=Visual Studio 18 2026"
            call configure.bat ^
              x64 ^
              qt6 ^
              -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
              -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
              -D CMAKE_CONFIGURATION_TYPES=Release ^
              -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
              -D CMAKE_POLICY_DEFAULT_CMP0218=OLD ^
              -D CMAKE_CXX_FLAGS=/DAssertIsDebug=__noop ^
              -D CMAKE_C_COMPILER_LAUNCHER=sccache ^
              -D CMAKE_CXX_COMPILER_LAUNCHER=sccache ^
              -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
              %MTPROTO_TEST_FLAGS% ^
              %LTO_FLAGS%
          ) else (
            call configure.bat ^
              -G "Ninja Multi-Config" ^
              qt6 ^
              -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
              -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
              -D CMAKE_CONFIGURATION_TYPES=Release ^
              -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
              -D CMAKE_POLICY_DEFAULT_CMP0218=OLD ^
              -D CMAKE_CXX_FLAGS=/DAssertIsDebug=__noop ^
              -D CMAKE_C_COMPILER_LAUNCHER=sccache ^
              -D CMAKE_CXX_COMPILER_LAUNCHER=sccache ^
              -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
              %MTPROTO_TEST_FLAGS% ^
              %LTO_FLAGS%
          )

          if errorlevel 1 exit /b 1

          if /I "%BUILD_VARIANT%"=="patched" (
            for /f "usebackq delims=" %%i in (`powershell -NoProfile -Command "(Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss UTC', [Globalization.CultureInfo]::InvariantCulture)"`) do set "SOURCE_BUILD_TIME_UTC=%%i"
            powershell -NoProfile -Command "$p = Join-Path $env:TBUILD '%REPO_NAME%\Telegram\SourceFiles\window\window_main_menu_helpers.cpp'; $text = [IO.File]::ReadAllText($p); if (-not $text.Contains('__TDESKTOP_BUILD_TIME_UTC__')) { throw 'Build time placeholder was not found.' }; $text = $text.Replace('__TDESKTOP_BUILD_TIME_UTC__', $env:SOURCE_BUILD_TIME_UTC); $encoding = New-Object System.Text.UTF8Encoding $false; [IO.File]::WriteAllText($p, $text, $encoding)"
            if errorlevel 1 exit /b 1
          )

          rem Compile every translation unit changed by the patch first. This
          rem exposes patch-specific type errors before the full Telegram target,
          rem while the resulting objects and PCH files remain reusable below.
          if /I "%BUILD_VARIANT%"=="patched" if /I "%BUILD_GENERATOR%"=="ninja" (
            ninja -C ..\out -f build-Release.ninja -j %BUILD_PARALLEL% ^
              Telegram/CMakeFiles/Telegram.dir/Release/SourceFiles/boxes/connection_box.cpp.obj
            if errorlevel 1 exit /b 1
            ninja -C ..\out -f build-Release.ninja -j %BUILD_PARALLEL% ^
              Telegram/CMakeFiles/Telegram.dir/Release/SourceFiles/core/core_settings_proxy.cpp.obj
            if errorlevel 1 exit /b 1
            ninja -C ..\out -f build-Release.ninja -j %BUILD_PARALLEL% ^
              Telegram/CMakeFiles/Telegram.dir/Release/SourceFiles/core/proxy_rotation_manager.cpp.obj
            if errorlevel 1 exit /b 1
            ninja -C ..\out -f build-Release.ninja -j %BUILD_PARALLEL% ^
              Telegram/CMakeFiles/Telegram.dir/Release/SourceFiles/mtproto/connection_resolving.cpp.obj
            if errorlevel 1 exit /b 1
            ninja -C ..\out -f build-Release.ninja -j %BUILD_PARALLEL% ^
              Telegram/CMakeFiles/td_mtproto.dir/Release/SourceFiles/mtproto/details/mtproto_tls_socket.cpp.obj
            if errorlevel 1 exit /b 1
            ninja -C ..\out -f build-Release.ninja -j %BUILD_PARALLEL% ^
              Telegram/CMakeFiles/Telegram.dir/Release/SourceFiles/mtproto/mtp_instance.cpp.obj
            if errorlevel 1 exit /b 1
            ninja -C ..\out -f build-Release.ninja -j %BUILD_PARALLEL% ^
              Telegram/CMakeFiles/td_mtproto.dir/Release/SourceFiles/mtproto/mtproto_proxy_data.cpp.obj
            if errorlevel 1 exit /b 1
            ninja -C ..\out -f build-Release.ninja -j %BUILD_PARALLEL% ^
              Telegram/CMakeFiles/Telegram.dir/Release/SourceFiles/mtproto/proxy_check.cpp.obj
            if errorlevel 1 exit /b 1
          )

          cmake --build ..\out ^
            --config Release ^
            --target Telegram ^
            --parallel %BUILD_PARALLEL%
          if errorlevel 1 exit /b 1

          if /I "%BUILD_VARIANT%"=="patched" (
            ..\out\Release\Telegram.exe --validate-mtproto-client-hello
            if errorlevel 1 exit /b 1
          )

      - name: Collect executable and build metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $out = Join-Path `
            $env:TBUILD `
            "$env:REPO_NAME\out\Release"

          $artifact = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifact-release"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifact |
            Out-Null

          $files = Get-ChildItem -Path $out -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") }

          $telegram = $files |
            Where-Object { $_.Name -eq "Telegram.exe" }

          if (-not $telegram) {
            throw "Telegram.exe was not found in $out"
          }

          $files |
            Copy-Item `
              -Destination $artifact `
              -Force

          $generatorDescription = if ($env:BUILD_GENERATOR -eq "official") {
            "Visual Studio 18 2026 / MSBuild"
          }
          else {
            "Ninja Multi-Config"
          }

          $ltoDescription = if ($env:BUILD_LTO_MODE -eq "on") {
            "enabled"
          }
          else {
            "disabled"
          }

          @"
          Source repository: ${{ inputs.source_repository }}
          Source branch: dev
          Source commit: $env:SOURCE_SHA
          Mirror branch: upstream-dev
          Source mode: $env:BUILD_VARIANT
          Release build workaround: AssertIsDebug=__noop
          Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Build profile: $env:BUILD_PROFILE
          Profile details: $env:BUILD_PROFILE_TITLE
          Configuration: Release
          Generator: $generatorDescription
          Architecture: Windows x64
          LTO: $ltoDescription
          Parallel build processes: $env:BUILD_PARALLEL
          Auto-update: disabled
          Crash reports: disabled
          "@ |
            Set-Content `
              -Path (Join-Path $artifact "BUILD_INFO.txt") `
              -Encoding ascii

          Get-ChildItem -Path $artifact -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object {
              "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))"
            } |
            Set-Content `
              -Path (Join-Path $artifact "SHA256SUMS.txt") `
              -Encoding ascii

      - name: Create maximum-compression 7z package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifact-release"

          $packageDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "package-output"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $packageDir |
            Out-Null

          $archiveName = "tdesktop-$($env:BUILD_VARIANT).$($env:SOURCE_SHORT_SHA).7z"
          $checksumName = "$archiveName.sha256"
          $archivePath = Join-Path $packageDir $archiveName
          $checksumPath = Join-Path $packageDir $checksumName
          $metadataPath = Join-Path $packageDir "release-metadata.json"

          $sevenZipCommand = Get-Command `
            "7z.exe" `
            -ErrorAction SilentlyContinue

          if ($sevenZipCommand) {
            $sevenZip = $sevenZipCommand.Source
          }
          else {
            $sevenZip = Join-Path `
              $env:ProgramFiles `
              "7-Zip\7z.exe"
          }

          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip executable was not found: $sevenZip"
          }

          Push-Location $artifactDir

          try {
            & $sevenZip a `
              "-t7z" `
              "-mx=9" `
              "-m0=lzma2" `
              "-ms=on" `
              "-mmt=on" `
              $archivePath `
              ".\*"

            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip compression failed: exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          & $sevenZip t $archivePath

          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip verification failed: exit code $LASTEXITCODE"
          }

          $archiveHash = (
            Get-FileHash `
              $archivePath `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$archiveHash  $archiveName" |
            Set-Content `
              -Path $checksumPath `
              -Encoding ascii

          $generatorName = if ($env:BUILD_GENERATOR -eq "official") {
            "Visual Studio 18 2026 / MSBuild"
          }
          else {
            "Ninja Multi-Config"
          }

          $ltoValue = if ($env:BUILD_LTO_MODE -eq "on") {
            "ON"
          }
          else {
            "OFF"
          }

          $buildParameters = (
            "Windows x64 · MSVC 14.44 · Qt 6 · " +
            "$generatorName · IPO/LTO=$ltoValue · $env:BUILD_VARIANT"
          )

          [ordered]@{
            source_sha = $env:SOURCE_SHA
            short_sha = $env:SOURCE_SHORT_SHA
            variant = $env:BUILD_VARIANT
            profile = $env:BUILD_PROFILE
            profile_title = $env:BUILD_PROFILE_TITLE
            build_parameters = $buildParameters
            workflow_run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            archive_name = $archiveName
            checksum_name = $checksumName
          } |
            ConvertTo-Json |
            Set-Content `
              -Path $metadataPath `
              -Encoding utf8

          Get-Item `
            $archivePath, `
            $checksumPath, `
            $metadataPath |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload successful Windows package
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Telegram-dev-${{ steps.source.outputs.short_sha }}-Windows-x64-${{ inputs.variant }}-${{ inputs.profile }}
          path: package-output\
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Export profile result
        id: result
        if: always()
        shell: pwsh
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          $ErrorActionPreference = "Stop"

          $built = ($env:UPLOAD_OUTCOME -eq "success")
          $builtText = $built.ToString().ToLowerInvariant()

          "built=$builtText" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          if ($built) {
            $summary = @(
              "## Build profile succeeded"
              ""
              "- variant: $env:BUILD_VARIANT"
              "- profile: $env:BUILD_PROFILE"
              "- details: $env:BUILD_PROFILE_TITLE"
              "- source: $env:SOURCE_SHA"
              "- Actions artifact: uploaded for 14 days"
            )
          }
          else {
            $summary = @(
              "## Build profile did not produce a package"
              ""
              "- variant: $env:BUILD_VARIANT"
              "- profile: $env:BUILD_PROFILE"
              "- details: $env:BUILD_PROFILE_TITLE"
              "- next fallback: requested automatically"
            )
          }

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
