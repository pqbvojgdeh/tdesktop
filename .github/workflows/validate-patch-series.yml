name: Validate MTProto patch series

on:
  workflow_dispatch:
  push:
    branches:
      - mtproto-patches
    paths:
      - patches/**
      - .github/workflows/**
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: patch-source
          fetch-depth: 1

      - name: Checkout current official dev
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: telegramdesktop/tdesktop
          ref: dev
          path: source
          fetch-depth: 1
          submodules: false

      - name: Enforce ClientHello profile review deadline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import date
          import json
          from pathlib import Path

          path = Path("patch-source/patches/clienthello-profile-review.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("schema_version") != 1:
              raise SystemExit("Unsupported ClientHello review schema.")
          profiles = data.get("profiles")
          if not isinstance(profiles, list) or len(profiles) < 6:
              raise SystemExit("ClientHello review manifest is incomplete.")
          review_by = date.fromisoformat(data["review_by"])
          if date.today() > review_by:
              print(
                  "::error::ClientHello profiles are past their capture "
                  f"review deadline ({review_by.isoformat()})."
              )
              raise SystemExit(1)
          print(f"ClientHello capture review is due by {review_by.isoformat()}.")
          PY

      - name: Validate workflows with actionlint
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/patch-source:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.7

      - name: Parse embedded PowerShell blocks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check pyyaml
          @'
          from pathlib import Path
          import re
          import yaml

          root = Path("patch-source/.github/workflows")
          output = Path("pwsh-blocks")
          output.mkdir(exist_ok=True)
          count = 0
          for workflow in root.glob("*.yml"):
              data = yaml.safe_load(workflow.read_text(encoding="utf-8"))
              for job_name, job in (data.get("jobs") or {}).items():
                  for index, step in enumerate(job.get("steps") or []):
                      shell = str(step.get("shell", "")).lower()
                      run = step.get("run")
                      if run and shell.startswith("pwsh"):
                          target = output / f"{workflow.stem}-{job_name}-{index}.ps1"
                          sanitized = re.sub(
                              r"\$\{\{.*?\}\}",
                              "GITHUB_EXPRESSION",
                              str(run),
                              flags=re.DOTALL,
                          )
                          target.write_text(sanitized, encoding="utf-8")
                          count += 1
          print(f"Extracted {count} PowerShell blocks")
          '@ | python

          Get-ChildItem pwsh-blocks -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax error in $($_.Name)"
            }
          }

      - name: Apply complete series to current dev
        shell: bash
        run: |
          set -euo pipefail
          patch_dir="$PWD/patch-source/patches"
          source_dir="$PWD/source"
          mapfile -t patches < <(
            sed -e 's/#.*$//' -e '/^[[:space:]]*$/d' \
              "$patch_dir/series.txt"
          )
          test "${#patches[@]}" -gt 0
          for name in "${patches[@]}"; do
            test "$name" = "$(basename "$name")"
            test -f "$patch_dir/$name"
            echo "Applying $name"
            git -C "$source_dir" apply --check "$patch_dir/$name"
            git -C "$source_dir" apply "$patch_dir/$name"
          done
          git -C "$source_dir" diff --check

      # Only invariants that the compiled policy tests cannot observe are
      # asserted here. Everything that duplicated a test static_assert, and
      # every check that merely pinned formatting, was removed: those broke
      # on harmless refactors without catching real regressions.
      - name: Verify hardening contracts
        shell: bash
        run: |
          set -euo pipefail
          build_profile="patch-source/.github/workflows/build-patched-upstream-dev-windows-profile.yml"
          resolving="source/Telegram/SourceFiles/mtproto/connection_resolving.cpp"
          tcp="source/Telegram/SourceFiles/mtproto/connection_tcp.cpp"
          tls="source/Telegram/SourceFiles/mtproto/details/mtproto_tls_socket.cpp"
          tls_header="source/Telegram/SourceFiles/mtproto/details/mtproto_tls_socket.h"
          rotation="source/Telegram/SourceFiles/core/proxy_rotation_policy.h"
          rotation_manager="source/Telegram/SourceFiles/core/proxy_rotation_manager.cpp"
          coordinator="source/Telegram/SourceFiles/mtproto/proxy_check.cpp"
          resumption="source/Telegram/SourceFiles/mtproto/details/mtproto_chromium_resumption_cache.h"
          settings_proxy="source/Telegram/SourceFiles/core/core_settings_proxy.cpp"
          cmake_root="source/Telegram/CMakeLists.txt"
          proxy_ui="source/Telegram/SourceFiles/boxes/connection_box.cpp"
          main_menu="source/Telegram/SourceFiles/window/window_main_menu.cpp"
          menu_helpers="source/Telegram/SourceFiles/window/window_main_menu_helpers.cpp"
          tests="patch-source/patches/tests"

          # --- Regression guards --------------------------------------------
          # Each one names a defect that was fixed once and must not return.
          # A compiled test cannot see these: they are about code that has to
          # stay absent, not about a value that has to be right.
          if grep -Fq '_waitingForQuarantine' "$resolving"; then
            echo "::error::ResolvingConnection waits inside quarantine again."
            exit 1
          fi
          if grep -Fq 'Connect now instead' "$tls"; then
            echo "::error::Slow-connect overflow fails open into a burst again."
            exit 1
          fi
          if grep -Eq 'secret\.size\(\) (> 17|>= 21)' "$resolving" "$tcp"; then
            echo "::error::Slow FakeTLS classification bypasses the shared policy."
            exit 1
          fi
          if grep -Fq 'S("\x00\x29\x00\x94"_q);' "$tls"; then
            echo "::error::YandexGost sends an unconditional synthetic PSK again."
            exit 1
          fi
          if grep -Fq '(void)ValidateClientHello' "$tls"; then
            echo "::error::A ClientHello mutation discards the validation result."
            exit 1
          fi
          if grep -Fq 'entry->ping' "$rotation_manager"; then
            echo "::error::Proxy rotation scores a raw one-shot ping again."
            exit 1
          fi
          if grep -Fq 'entry->availableAt < _switchStartedAt' "$rotation_manager"; then
            echo "::error::Fresh prior-round proxy results are discarded again."
            exit 1
          fi
          if grep -Eq 'Expects\(_state\.(start|finish)' "$coordinator"; then
            echo "::error::Coordinator state mutation is hidden inside Expects."
            exit 1
          fi
          if grep -Fq 'const auto started = _state.start(kMaxConcurrentProxyChecks);' "$coordinator"; then
            echo "::error::Proxy coordinator reintroduces the MSVC local-name collision."
            exit 1
          fi
          if grep -Eq 'QPointer<QTimer>|new QTimer|setInterval\(1000\)' "$proxy_ui"; then
            echo "::error::Proxy UI performs a one-second list-wide refresh again."
            exit 1
          fi
          if grep -Fq 'item.checker = MTP::ScheduleProxyCheck(' "$proxy_ui"; then
            echo "::error::Proxy UI stores a handle after a possibly synchronous callback."
            exit 1
          fi
          if grep -Fq '_checksFinished' "$proxy_ui"; then
            echo "::error::Proxy UI rebuilds and reorders rows after a check batch again."
            exit 1
          fi
          if grep -R -Eq '(^|[^[:alnum:]_])assert\(' "$tests"; then
            echo "::error::Policy tests must not depend on assert side effects."
            exit 1
          fi
          if grep -Fq 'cmake -S . -B ..\out' "$build_profile"; then
            echo "::error::MTProto test relink reintroduces a non-canonical source path."
            exit 1
          fi

          # --- Cross-file and build invariants -------------------------------
          # These span several files or exist only for the build, so no single
          # translation unit test can cover them.
          grep -Fq '#include "mtproto/details/mtproto_slow_connect_policy.h"' "$tcp"
          grep -Fq '#include <QtNetwork/QTcpSocket>' "$tls_header"
          grep -Fq 'target_compile_definitions(td_mtproto PRIVATE' "$cmake_root"
          grep -Fq '#ifdef DESKTOP_APP_MTPROTO_PROFILE_TESTS' "$tls"
          grep -Fq '#ifdef DESKTOP_APP_MTPROTO_PROFILE_TESTS' "$tls_header"
          grep -Fq 'cmake -D DESKTOP_APP_MTPROTO_PROFILE_TESTS=OFF ..\out' "$build_profile"
          grep -Fq 'kProxySettingsMaximumClientHelloType' "$settings_proxy"

          # Values a standalone policy test cannot reach.
          grep -Fq 'kProxyRotationDeviationWeight = 4' "$rotation"
          grep -Fq 'std::chrono::ceil<Lifetime>' "$resumption"

          # --- Build metadata placeholders -----------------------------------
          # The Windows build substitutes these with sed and fails when the
          # count is wrong. Checking here turns a multi-hour build failure
          # into a five-minute one.
          test "$(grep -Foc '__TDESKTOP_COMMIT_FULL__' "$main_menu")" = 1
          test "$(grep -Foc '__TDESKTOP_COMMIT_SHORT__' "$main_menu")" = 1
          test "$(grep -Foc '__TDESKTOP_COMMIT_TIME_UTC__' "$menu_helpers")" = 1
          test "$(grep -Foc '__TDESKTOP_BUILD_TIME_UTC__' "$menu_helpers")" = 1
          grep -Fq 'ResolveEmbeddedBuildMetadata(' "$menu_helpers"

          test -s patch-source/patches/CLIENTHELLO_PROFILE_MAINTENANCE.md

          echo "Hardening contracts verified."

      - name: Compile and run production policy tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-bin
          for source_file in patch-source/patches/tests/*.cpp; do
            name="$(basename "${source_file%.cpp}")"
            g++ \
              -std=c++20 \
              -DNDEBUG \
              -Wall \
              -Wextra \
              -Wconversion \
              -Wsign-conversion \
              -Werror \
              -pthread \
              -Isource/Telegram/SourceFiles \
              "$source_file" \
              -o "test-bin/$name"
            "test-bin/$name"
          done
